        - AI Budget Intelligence
      summary: 'Analyze payment, budget, and refund history'
      description: >-
        Analyzes only the authenticated brand’s transaction, refund, campaign, and recorded daily spend
        history. Fraud indicators are advisory and do not block payment. Recommendations return
        INSUFFICIENT_DATA when samples are too small. Refund methods follow the original-payment-method rule.
        Country method eligibility depends on the backend PAYMENT_METHODS_BY_COUNTRY deployment configuration.
      operationId: post_wallet_intelligence
      x-roles:
        - BRAND
      parameters: []
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletIntelligenceAIResponse'
              examples:
                response:
                  summary: Example successful response
                  value:
                    success: true
                    data:
                      paymentFraud:
                        status: INSUFFICIENT_DATA
                        risk: UNKNOWN
                        reasonCodes: []
                        requiresHumanReview: false
                      paymentMethodRecommendation:
                        status: INSUFFICIENT_DATA
                        method: null
                        basis: null
                      depositAmountPrediction:
                        status: INSUFFICIENT_DATA
                        amount: null
                        sampleSize: 0
                        basis: null
                      dailyBudgetRecommendation:
                        status: INSUFFICIENT_DATA
                        recommendedLimit: null
                        basis: null
                      budgetExhaustionPrediction:
                        status: INSUFFICIENT_DATA
                        daysRemaining: null
                        estimatedExhaustionAt: null
                      spendingAnomaly:
                        status: INSUFFICIENT_DATA
                        risk: UNKNOWN
                        reasonCodes: []
                      refundFraud:
                        status: INSUFFICIENT_DATA
                        risk: UNKNOWN
                        reasonCodes: []
                      refundMethodRecommendation:
                        status: INSUFFICIENT_DATA
                        method: null
                        basis: REFUND_METHOD_MUST_MATCH_ORIGINAL_PAYMENT_METHOD
                      refundLikelihoodPrediction:
                        status: INSUFFICIENT_DATA
                        probability: null
                        sampleSize: 0
        '400':
