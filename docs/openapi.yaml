              enum:
                - ESTIMATED
                - INSUFFICIENT_DATA
            windowDays:
              type: integer
              const: 7
            currency:
              type: string
              const: USD
            method:
              type: string
              const: MATURED_VIEW_TREND_AND_REALIZED_CPM
            estimatedGrossAmountCents:
              type:
                - integer
                - 'null'
              minimum: 0
            estimatedCreatorNetAmountCents:
              type:
                - integer
                - 'null'
              minimum: 0
            predictedNext7DaysViews:
              type:
                - integer
                - 'null'
              minimum: 0
            confidence:
              type: number
              minimum: 0
              maximum: 1
            campaignsAnalyzed:
              type: integer
              minimum: 0
              maximum: 100
            campaignsEstimated:
              type: integer
              minimum: 0
              maximum: 100
            explanation:
              type: string
              maxLength: 500
            campaigns:
              type: array
              maxItems: 100
              items:
                type: object
                required:
                  - campaignId
                  - status
                  - historicalDays
                  - maturedValidatedViews
                  - predictedNext7DaysViews
                  - estimatedGrossAmountCents
                  - estimatedCreatorNetAmountCents
                  - confidence
                  - explanation
                properties:
                  campaignId:
                    type: string
                  status:
                    type: string
                    enum:
                      - ESTIMATED
                      - INSUFFICIENT_DATA
                  historicalDays:
                    type: integer
                    minimum: 0
                    maximum: 7
                  maturedValidatedViews:
                    type: integer
                    minimum: 0
                  predictedNext7DaysViews:
                    type:
                      - integer
                      - 'null'
                    minimum: 0
                  estimatedGrossAmountCents:
                    type:
                      - integer
                      - 'null'
                    minimum: 0
                  estimatedCreatorNetAmountCents:
                    type:
                      - integer
                      - 'null'
                    minimum: 0
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  explanation:
                    type: string
                    maxLength: 500
  responses:
    Success:
      description: Request completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    PaginatedSuccess:
      description: Paginated request completed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - $ref: '#/components/schemas/PaginatedResponse'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller lacks the required role or resource ownership.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not visible to caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Invalid lifecycle transition or conflicting resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Required payment detail encryption configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: The authenticated client or IP exceeded the endpoint rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: The upstream AI service returned an invalid or unsuccessful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: The backend could not complete the request.
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - message
            properties:
              success:
                type: boolean
                const: false
              message:
                type: string
              code:
                type: string
    ApiValidationError:
      description: Request validation failed. Main Backend validation errors use HTTP 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Validation failed
            code: VALIDATION_ERROR
    ApiUnauthorized:
      description: 'Bearer token is missing, invalid, expired, or revoked.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Not authorized
            code: UNAUTHORIZED
    ApiForbidden:
      description: The caller has the wrong role or does not own the referenced resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Forbidden
            code: FORBIDDEN
    ApiNotFound:
      description: The resource does not exist or is not visible to this caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Resource not found
            code: NOT_FOUND
    ApiConflict:
      description: The requested lifecycle transition conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: The resource is not available for this action.
            code: CONFLICT
    ApiRateLimited:
      description: The caller exceeded the configured endpoint rate limit.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Too many requests
            code: TOO_MANY_REQUESTS
    ApiBadGateway:
      description: An upstream AI or integration service failed or returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Upstream service unavailable
            code: AI_SERVICE_BAD_RESPONSE
    ApiServiceUnavailable:
      description: A required service or encryption configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Service unavailable
            code: SERVICE_UNAVAILABLE
    ApiServerError:
      description: The request could not be completed. Internal details are not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            success: false
            message: Server error
            code: INTERNAL_ERROR
