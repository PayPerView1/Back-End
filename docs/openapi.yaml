openapi: 3.1.0
info:
  title: PayPerView Main Backend API
  version: 1.0.0
  description: >-
    OpenAPI contract for all currently mounted Main Backend HTTP routes. Route coverage is checked against
    Express router definitions by scripts/validateOpenApi.js. API data uses USD and ISO-8601 UTC timestamps
    unless noted. Upload routes accept multipart/form-data; exported files and material downloads return
    binary or CSV responses.
  contact:
    name: PayPerView Backend
servers:
  - url: /api/v1
    description: Main Backend API base path
tags:
  - name: Service
    description: Service liveness and API entry point.
  - name: Authentication
    description: 'Registration, login, verification, password, and OAuth flows.'
  - name: Profile
    description: Authenticated user profile operations.
  - name: Campaign taxonomy
    description: Public campaign category and sub-category dictionaries.
  - name: Campaign discovery
    description: 'Creator discovery, search, recommendations, and campaign details.'
  - name: Campaign management
    description: 'Brand campaign creation, drafts, lifecycle, and dashboard operations.'
  - name: AI Campaign Intelligence
    description: >-
      Owner-scoped draft assistance, compliance checks, category suggestions, and campaign performance
      insights.
  - name: AI Recommendations
    description: Advertiser-side applicant compatibility ranking using campaign requirements and real creator data.
  - name: Campaign budget
    description: Brand campaign budget allocation and controls.
  - name: Applications
    description: Creator campaign applications and brand decisions.
  - name: Materials and downloads
    description: Accepted-creator material access and download tracking.
  - name: Content submissions
    description: 'Creator submission preparation, asynchronous AI checks, and review.'
  - name: Analytics
    description: Campaign analytics and verified submission-view history.
  - name: Reports and moderation
    description: Public reports and administrator moderation.
  - name: AI Report Intelligence
    description: Administrator-only report classification and non-binding duplicate/reviewer triage.
  - name: Notifications
    description: Authenticated notification list and read state.
  - name: Wallet and payments
    description: 'Wallet, funding, transfers, refunds, transaction history, and webhooks.'
  - name: AI Budget Intelligence
    description: 'Owner-scoped advisory payment, budget, spending, and refund risk analysis.'
  - name: AI Wallet and Withdrawal Intelligence
    description: >-
      Creator-scoped withdrawal risk signals, processing estimates, and country-configured payment options.
      Results are advisory and do not alter payouts.
  - name: AI Language Services
    description: Authenticated Arabic-English language detection and bounded dynamic translation.
  - name: Creator earnings
    description: 'Creator earnings ledger, payment methods, and withdrawals.'
  - name: AI Chat
    description: 'Authenticated, rate-limited PayPerView chat threads and feedback.'
security:
  - BearerAuth: []
paths:
  /:
    get:
      tags:
        - Service
      summary: Check backend liveness
      description: Public endpoint.
      operationId: get_root
      x-roles: []
      parameters: []
      responses:
        '200':
          description: Plain text liveness response.
          content:
            text/plain:
              schema:
                type: string
                example: Halal Clipping API is Running...
      security: []
      servers:
        - url: /
          description: Main Backend root
  '/admin/submissions/{id}/review':
