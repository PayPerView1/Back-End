components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'PayPerView access JWT. Send it as Authorization: Bearer <token>.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: 66a111111111111111111111
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - code
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
    ValidationErrorEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          type: object
          properties:
            page:
              type: integer
            perPage:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    PaymentMethod:
      type: object
      required:
        - id
        - type
        - label
        - last4
        - isDefault
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum:
            - PAYPAL
            - BANK_TRANSFER
            - STC_PAY
            - MADA
            - OTHER
        label:
          type: string
        last4:
          type: string
          pattern: '^[A-Z0-9]{4}$'
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ChatThreadCreated:
      type: object
      required:
        - threadId
        - aiThreadId
        - title
        - createdAt
      properties:
        threadId:
          $ref: '#/components/schemas/ObjectId'
        aiThreadId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatThreadSummary:
      type: object
      required:
        - id
        - title
        - updatedAt
        - lastMessage
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        lastMessage:
          type: string
    ChatMessage:
      type: object
      required:
        - id
        - role
        - content
        - createdAt
        - feedback
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        feedback:
          type:
            - object
            - 'null'
          properties:
            rating:
              type: string
              enum:
                - HELPFUL
                - NOT_HELPFUL
            comment:
              type: string
              maxLength: 1000
            submittedAt:
              type: string
              format: date-time
    Withdrawal:
      type: object
      required:
        - id
        - amount
        - currency
        - status
        - paymentMethod
        - note
        - externalReference
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          example: USD
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - COMPLETED
            - FAILED
        paymentMethod:
          type:
            - object
            - 'null'
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            type:
              type: string
              enum:
                - PAYPAL
                - BANK_TRANSFER
                - STC_PAY
                - MADA
                - OTHER
